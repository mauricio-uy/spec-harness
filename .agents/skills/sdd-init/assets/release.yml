# Releases every slice merged into main: changelog entry, release commit and tags.
# Copy to .github/workflows/release.yml. If main is protected, this job needs a bypass to push:
# the RELEASE_DEPLOY_KEY deploy key, or GitHub Actions in an organization (see references/github.md).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.release.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Pushes with the deploy key when the secret exists, otherwise with GITHUB_TOKEN.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Release merged slices
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          python .agents/bin/sdd.py release --apply
          git push --follow-tags origin HEAD:main
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "tags=$(git tag --points-at HEAD | xargs)" >> "$GITHUB_OUTPUT"
          fi

  # Tags pushed with the deploy key trigger other workflows, so a separate deploy-on-tag
  # workflow works. Tags pushed with GITHUB_TOKEN do not: in that case deploy from here.
  # Uncomment and point it at the project's deployment, e.g. a reusable workflow.
  # deploy:
  #   needs: release
  #   if: needs.release.outputs.tags != ''
  #   uses: ./.github/workflows/deploy.yml   # on: workflow_call, with a "tags" input
  #   with:
  #     tags: ${{ needs.release.outputs.tags }}
  #   secrets: inherit
