# Releases every slice merged into main: one annotated tag per affected release unit,
# carrying the release notes, and a GitHub Release from each tag. It only pushes tags,
# so the workflow's GITHUB_TOKEN is enough. Copy to .github/workflows/release.yml.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.release.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Release merged slices
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git tag --list | sort)
          python .agents/bin/sdd.py release --apply
          tags=$(comm -13 <(echo "$before") <(git tag --list | sort) | xargs)
          for tag in $tags; do
            git push origin "refs/tags/$tag"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Publish missing GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also covers tags whose release failed to publish in an earlier run.
          for tag in $(git tag --list 'v[0-9]*' '*/v[0-9]*' --sort=-creatordate | head -n 20); do
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --notes-from-tag --title "$tag"
          done

  # Tags and releases created with GITHUB_TOKEN do not trigger other workflows, so deploy
  # from here. Uncomment and point it at the project's deployment, e.g. a reusable workflow.
  # deploy:
  #   needs: release
  #   if: needs.release.outputs.tags != ''
  #   uses: ./.github/workflows/deploy.yml   # on: workflow_call, with a "tags" input
  #   with:
  #     tags: ${{ needs.release.outputs.tags }}
  #   secrets: inherit
