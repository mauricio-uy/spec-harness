# Releases every slice merged into main: changelog entry, release commit and tags.
# Copy to .github/workflows/release.yml. If main is protected, let GitHub Actions bypass
# the protection so this job can push the release commit and tags.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Release merged slices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .agents/bin/sdd.py release --apply
          git push --follow-tags origin HEAD:main
